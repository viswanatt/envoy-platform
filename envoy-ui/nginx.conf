server {
    listen 80;
    listen [::]:80;               
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /health {
        root /usr/share/nginx/html;
        try_files /health.html =200;
        access_log off;
    }

    location /api/ {
        proxy_pass http://envoy-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
