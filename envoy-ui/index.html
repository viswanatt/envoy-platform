<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoy Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #status { color: green; }
    </style>
</head>
<body>
    <h1>Welcome to Envoy</h1>
    <p>Self‑service ephemeral environments.</p>
    <div id="api-info">Loading API info...</div>
    <script>
        fetch('/api/info')
            .then(response => response.json())
            .then(data => {
                document.getElementById('api-info').innerHTML = `
                    <p>Service: ${data.service}</p>
                    <p>Version: ${data.version}</p>
                    <p>Hostname: ${data.hostname}</p>
                `;
            })
            .catch(err => {
                document.getElementById('api-info').innerHTML = 'API not reachable: ' + err;
            });
    </script>
</body>
</html>
