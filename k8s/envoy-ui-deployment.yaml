apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ui
  namespace: envoy-system
  labels:
    app: envoy-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ui
  template:
    metadata:
      labels:
        app: envoy-ui
    spec:
      containers:
        - name: envoy-ui
          image: envoy-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
