apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-api
  namespace: envoy-system
  labels:
    app: envoy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envoy-api
  template:
    metadata:
      labels:
        app: envoy-api
    spec:
      containers:
        - name: envoy-api
          image: envoy-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
